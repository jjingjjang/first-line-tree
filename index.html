<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE FIRST LINE · 연필 숲 트리 3D</title>
<style>
  :root { --ink:#f5f0e8; --muted:#bfb6aa; --gold:#d9b46a; --red:#b3222a; --panel:rgba(30,27,24,.80); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#2b2724; color:var(--ink);
    font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; display:block; }
  .hud { position:fixed; z-index:2; }
  #title { top:22px; left:26px; pointer-events:none; }
  #title .k { font-size:12px; letter-spacing:.12em; color:var(--gold); }
  #title h1 { margin:6px 0 2px; font:700 34px/1.1 Cambria,Georgia,serif; letter-spacing:.02em; }
  #title .s { font-size:14px; color:var(--muted); }
  #panel { left:22px; bottom:22px; width:372px; background:var(--panel); border:1px solid rgba(255,255,255,.08);
    border-radius:12px; padding:16px 18px; backdrop-filter:blur(6px); }
  #panel h2 { margin:0 0 8px; font-size:13px; font-weight:700; color:var(--gold); letter-spacing:.04em; }
  .seg { display:grid; gap:6px; margin-bottom:12px; }
  .seg.c2 { grid-template-columns:repeat(2,1fr); } .seg.c3 { grid-template-columns:repeat(3,1fr); } .seg.c4 { grid-template-columns:repeat(4,1fr); }
  .seg button { background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.22); border-radius:8px;
    padding:7px 0 6px; font:inherit; font-size:12px; line-height:1.25; cursor:pointer; }
  .seg button b { display:block; font-size:13px; }
  .seg button.on { background:var(--red); border-color:var(--red); }
  .row { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  input[type=range] { flex:1; accent-color:var(--red); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 12px; }
  .stat { background:rgba(255,255,255,.05); border-radius:8px; padding:8px 10px; }
  .stat .v { font-size:18px; font-weight:700; }
  .stat .l { font-size:11px; color:var(--muted); }
  .toggles { display:flex; flex-wrap:wrap; gap:6px; }
  .toggles label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink);
    border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 10px; cursor:pointer; user-select:none; }
  .toggles input { accent-color:var(--red); margin:0; }
  #hint { right:22px; bottom:22px; font-size:12px; color:var(--muted); text-align:right; pointer-events:none; }
  #scaleTag { position:fixed; z-index:2; font-size:12px; color:var(--ink); background:rgba(0,0,0,.45);
    padding:2px 8px; border-radius:6px; pointer-events:none; display:none; transform:translate(-50%,-100%); }
  @media (max-width:640px){ #panel{ left:10px; right:10px; width:auto; bottom:10px; } #title h1{ font-size:26px; } #hint{ display:none; } }
  #loading { position:fixed; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--muted); font-size:14px; line-height:1.6; padding:24px; pointer-events:none; }
  #ptoggle { display:none; }
  @media (max-width:640px), (max-height:520px){
    #title { top:10px; left:12px; right:12px; } #title .k { display:none; }
    #title h1 { font-size:18px; margin:0; } #title .s { font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #panel { left:8px; right:8px; bottom:8px; width:auto; padding:6px; border-radius:10px;
      display:grid; grid-template-columns:1fr auto; gap:6px; align-items:stretch; max-height:60vh; overflow:auto; background:rgba(30,27,24,.72); }
    #panel h2 { display:none; } #panel #stageLabel { display:none !important; }
    #panel .more { display:none; grid-column:1 / -1; order:0; }
    #panel.open .more { display:block; }
    #panel.open h2 { display:block; font-size:12px; margin:2px 0 6px; }
    #panel.open .more h2 { display:block; }
    #stages { order:1; margin:0 !important; gap:4px; }
    #stages button { padding:4px 0 3px; font-size:10px; line-height:1.15; border-radius:7px; }
    #stages button b { font-size:12px; }
    #ptoggle { display:block; order:2; min-width:48px; padding:0 10px; background:transparent; color:var(--ink);
      border:1px solid rgba(255,255,255,.28); border-radius:7px; font:inherit; font-size:12px; cursor:pointer; }
    #panel.open #ptoggle { background:var(--red); border-color:var(--red); }
    .seg { margin-bottom:8px; } .seg button { padding:5px 0 4px; font-size:11px; } .seg button b { font-size:12px; }
    .stats { margin:8px 0; gap:6px; } .stat { padding:6px 8px; } .stat .v { font-size:15px; } .stat .l { font-size:10px; }
    .toggles label { font-size:11px; padding:4px 8px; }
    .row { font-size:12px; }
  }
  body.capture .hud, body.capture #scaleTag { display:none !important; }
  body.clear, body.clear #c { background:transparent !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="hud">
  <div class="k">KUNWON ARCHITECTS · CHRISTMAS INSTALLATION</div>
  <h1>THE FIRST LINE</h1>
  <div class="s" id="spec">연필 숲 트리</div>
</div>
<div id="panel" class="hud">
  <div class="more">
  <h2>트리 지름</h2>
  <div class="seg c2" id="vers">
    <button data-v="980"><b>외곽 Ø980</b>코어 Ø700</button>
    <button data-v="1500"><b>외곽 Ø1,500</b>코어 Ø1,220 · 링형 원판</button>
  </div>
  <h2>구멍 간격 (원판 둘레 방향)</h2>
  <div class="seg c3" id="sps">
    <button data-s="33"><b>33mm</b>촘촘</button>
    <button data-s="40"><b>40mm</b>보통</button>
    <button data-s="50"><b>50mm</b>성김</button>
  </div>
  </div>
  <h2 id="stageLabel">4주간의 변화</h2>
  <div class="seg c4" id="stages" style="margin-bottom:0">
    <button data-n="0"><b>11/27</b>설치</button>
    <button data-n="150"><b>12/1</b>참여 시작</button>
    <button data-n="420"><b>12/14</b>중간</button>
    <button data-n="99999"><b>12/24</b>완성</button>
  </div>
  <div class="more" style="margin-top:12px">
  <div class="row"><span>참여 인원</span><input id="slider" type="range" min="0" max="1000" step="1" value="0"><span id="sv">0명</span></div>
  <div class="stats">
    <div class="stat"><div class="v" id="nP">0</div><div class="l">남은 빨간 연필</div></div>
    <div class="stat"><div class="v" id="nC">0</div><div class="l">꽂힌 첫 선 카드</div></div>
    <div class="stat"><div class="v" id="nT">0</div><div class="l">전체 구멍 수</div></div>
  </div>
  <div class="toggles">
    <label><input type="checkbox" id="tRot" checked>자동 회전</label>
    <label><input type="checkbox" id="tCut">단면 보기</label>
    <label><input type="checkbox" id="tMan">1.7m 사람 스케일</label>
  </div>
  </div>
  <button id="ptoggle" type="button" aria-label="설정 열기">설정</button>
</div>
<div id="hint" class="hud">드래그: 회전 · 스크롤: 확대 · 우클릭 드래그: 이동</div>
<div id="scaleTag">1.7m</div>
<div id="loading">3D 모델을 불러오는 중…</div>
<script>
window.__fail = function(msg){ var L=document.getElementById('loading'); if(!L){ L=document.createElement('div'); L.id='loading'; document.body.appendChild(L); }
  L.innerHTML='이 기기에서 3D 모델을 표시하지 못했습니다.<br>PC의 크롬 또는 엣지에서 열어 주세요.'+(msg?'<br><small>('+msg.replace(/[<>&]/g,'')+')</small>':''); };
setTimeout(function(){ if(!window.__ready) window.__fail(''); }, 25000);
document.getElementById('ptoggle').addEventListener('click', function(){ var p=document.getElementById('panel'); p.classList.toggle('open'); this.textContent = p.classList.contains('open') ? '닫기' : '설정'; });
</script>
